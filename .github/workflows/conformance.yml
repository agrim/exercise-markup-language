name: EML conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m eml catalog --samples 17 -o catalog-report.json
      - run: |
          for recipe in examples/*.json; do python -m eml validate "$recipe"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-conformance
          path: catalog-report.json
